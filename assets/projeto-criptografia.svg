<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Criptografia com sequências numéricas, em C"><title>Criptografia com sequências numéricas, em C</title><style>@font-face{font-family:'SG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SG5';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}.lb{font:400 14px 'JB',monospace;letter-spacing:3px;fill:#38BDF8}.ti{font:700 34px 'SG',sans-serif;fill:#fff}.tx{font:500 21px 'SG5',sans-serif;fill:#94A3B8}.ch{font:400 16px 'JB',monospace;fill:#E6EDF3}.tr{animation:tr 5s linear infinite}@keyframes tr{to{stroke-dashoffset:-100}}.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.2}}.sh{animation:sh 6s ease-in-out infinite}@keyframes sh{0%,60%{transform:translateX(-400px)}100%{transform:translateX(1400px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
